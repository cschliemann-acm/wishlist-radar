<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · wishlist-radar</title>
  <link rel="stylesheet" href="/static/style.css?v=11">
</head>
<body class="login-body">
  <form class="card login" method="post" action="/login">
    <svg viewBox="0 0 32 32" width="40" height="40" aria-hidden="true" class="login-logo"><circle cx="16" cy="16" r="14" fill="currentColor"/><circle cx="16" cy="16" r="8" fill="none" stroke="var(--surface)" stroke-width="2.5"/><circle cx="16" cy="16" r="2.5" fill="var(--surface)"/></svg>
    <h1>wishlist-radar</h1>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" autofocus required>
    </label>
    {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
    <button class="btn btn-primary">Sign in</button>
  </form>
</body>
</html>
