<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>{% block title %}Wishlist{% endblock %} · wishlist-radar</title>
  <link rel="stylesheet" href="/static/style.css?v=2">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%231d6b4f'/><circle cx='16' cy='16' r='8' fill='none' stroke='white' stroke-width='2.5'/><circle cx='16' cy='16' r='2.5' fill='white'/></svg>">
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand" aria-label="Wishlist">
      <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="currentColor"/><circle cx="16" cy="16" r="8" fill="none" stroke="var(--bg)" stroke-width="2.5"/><circle cx="16" cy="16" r="2.5" fill="var(--bg)"/></svg>
      <span>wishlist-radar</span>
    </a>
    <nav>
      {% set path = request.url.path %}
      <a href="/" class="{{ 'on' if path == '/' or path.startswith('/items') }}">Wishlist{% if inbox_count %} <span class="count">{{ inbox_count }}</span>{% endif %}</a>
      <a href="/activity" class="{{ 'on' if path == '/activity' }}">Activity</a>
      <a href="/settings" class="{{ 'on' if path == '/settings' }}">Settings</a>
      <a href="/add" class="btn btn-primary btn-sm add-btn">+ Add</a>
    </nav>
  </header>

  <main class="wrap">
    {% if flash %}
      <div class="flash flash-{{ flash.kind }}" role="status">{{ flash.message }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <script src="/static/app.js?v=1" defer></script>
</body>
</html>
