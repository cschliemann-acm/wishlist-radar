<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f4f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>{% block title %}Wishlist{% endblock %} · wishlist-radar</title>
  <link rel="stylesheet" href="/static/style.css?v=12">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%231d6b4f'/><circle cx='16' cy='16' r='8' fill='none' stroke='white' stroke-width='2.5'/><circle cx='16' cy='16' r='2.5' fill='white'/></svg>">
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand" aria-label="Wishlist">
      <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="currentColor"/><circle cx="16" cy="16" r="8" fill="none" stroke="var(--bg)" stroke-width="2.5"/><circle cx="16" cy="16" r="2.5" fill="var(--bg)"/></svg>
      <span>wishlist-radar</span>
    </a>
    <nav>
      {% set path = request.url.path %}
      <a href="/" class="{{ 'on' if path == '/' or path.startswith('/items') }}">Wishlist{% if inbox_count %} <span class="count">{{ inbox_count }}</span>{% endif %}</a>
      <a href="/sales" class="{{ 'on' if path == '/sales' }}">Sales</a>
      <a href="/shops" class="{{ 'on' if path == '/shops' }}">Shops</a>
      <a href="/sizes" class="{{ 'on' if path == '/sizes' }}">Sizes</a>
      <a href="/activity" class="{{ 'on' if path == '/activity' }}">Activity</a>
      <a href="/settings" class="{{ 'on' if path == '/settings' }} icon-link" aria-label="Settings" title="Settings{{ ' · something needs attention' if problem_count }}">{% if problem_count %}<span class="alert-dot"></span>{% endif %}
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </a>
    </nav>
    <a href="/add" class="btn btn-primary btn-sm add-btn" aria-label="Add">+<span class="add-label"> Add</span></a>
  </header>

  <main class="wrap">
    {% if flash %}
      <div class="flash flash-{{ flash.kind }}" role="status">{{ flash.message }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <script src="/static/app.js?v=1" defer></script>
</body>
</html>
